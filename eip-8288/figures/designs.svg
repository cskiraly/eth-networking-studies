<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 384" width="878" height="384" role="img" aria-labelledby="t d"><title id="t">How raw transactions travel decides capacity once only some nodes aggregate</title><desc id="d">Privacy capacity of the five transport designs at 100 and 1,000 nodes, under three ways to share the work. With every node aggregating, every design holds at least 72 privacy tx/s at 1,000 nodes, and push 54 at 100. With a quarter of the nodes aggregating, at 1,000 nodes, push holds 6, pull 18, keep and coverage 36-54, and geth's relay at least 72. One builder holds 6-9 in every design but push, which holds 3-6.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="878" height="384" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">How raw transactions travel decides capacity once only some nodes aggregate</text><text x="20.0" y="48.0" class="sub" text-anchor="start">Privacy tx/s held on top of 15 signature tx/s, range over 4 seeds; the EIP's 1,000 ms tick, the fast prover, six-object blocks.</text><text x="20.0" y="64.0" class="sub" text-anchor="start">A node drawn at random proposes each slot; one builder proposes every block.</text><line x1="20" x2="42" y1="88" y2="88" class="s2"/><circle cx="31" cy="88" r="4.5" class="m2"/><text x="50.0" y="92.0" class="lab" text-anchor="start">100 nodes</text><line x1="129" x2="151" y1="88" y2="88" class="s1"/><circle cx="140" cy="88" r="4.5" class="m1"/><text x="159.0" y="92.0" class="lab" text-anchor="start">1,000 nodes</text><path d="M262,83.5 L269,88 L262,92.5 Z" class="m1"/><text x="278.0" y="92.0" class="lab" text-anchor="start">held at 72, the top rate every seed ran (seed 100 ran to 96)</text><text x="112.0" y="120.0" class="head" text-anchor="start">Every node aggregates</text><line x1="125.9" x2="125.9" y1="132" y2="332" class="grid"/><text x="125.9" y="348.0" class="ax" text-anchor="middle">3</text><line x1="169.1" x2="169.1" y1="132" y2="332" class="grid"/><text x="169.1" y="348.0" class="ax" text-anchor="middle">6</text><line x1="194.4" x2="194.4" y1="132" y2="332" class="grid"/><text x="194.4" y="348.0" class="ax" text-anchor="middle">9</text><line x1="212.4" x2="212.4" y1="132" y2="332" class="grid"/><text x="212.4" y="348.0" class="ax" text-anchor="middle">12</text><line x1="237.6" x2="237.6" y1="132" y2="332" class="grid"/><text x="237.6" y="348.0" class="ax" text-anchor="middle">18</text><line x1="262.9" x2="262.9" y1="132" y2="332" class="grid"/><text x="262.9" y="348.0" class="ax" text-anchor="middle">27</text><line x1="280.9" x2="280.9" y1="132" y2="332" class="grid"/><text x="280.9" y="348.0" class="ax" text-anchor="middle">36</text><line x1="306.1" x2="306.1" y1="132" y2="332" class="grid"/><text x="306.1" y="348.0" class="ax" text-anchor="middle">54</text><line x1="324.1" x2="324.1" y1="132" y2="332" class="grid"/><text x="324.1" y="348.0" class="ax" text-anchor="middle">72</text><text x="225.0" y="366.0" class="ax" text-anchor="middle">privacy tx/s held (log scale)</text><text x="98.0" y="156.0" class="lab" text-anchor="end">1, push</text><circle cx="306.1" cy="145.0" r="4.5" class="m2"><title>1, push, every node aggregates, 100 nodes: 54 privacy tx/s</title></circle><circle cx="324.1" cy="159.0" r="4.5" class="m1"><title>1, push, every node aggregates, 1,000 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,154.5 L338.1,159.0 L331.1,163.5 Z" class="m1"/><text x="98.0" y="196.0" class="lab" text-anchor="end">2, pull</text><circle cx="324.1" cy="185.0" r="4.5" class="m2"><title>2, pull, every node aggregates, 100 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,180.5 L338.1,185.0 L331.1,189.5 Z" class="m2"/><circle cx="324.1" cy="199.0" r="4.5" class="m1"><title>2, pull, every node aggregates, 1,000 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,194.5 L338.1,199.0 L331.1,203.5 Z" class="m1"/><text x="98.0" y="236.0" class="lab" text-anchor="end">3, keep</text><circle cx="324.1" cy="225.0" r="4.5" class="m2"><title>3, keep, every node aggregates, 100 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,220.5 L338.1,225.0 L331.1,229.5 Z" class="m2"/><circle cx="324.1" cy="239.0" r="4.5" class="m1"><title>3, keep, every node aggregates, 1,000 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,234.5 L338.1,239.0 L331.1,243.5 Z" class="m1"/><text x="98.0" y="276.0" class="lab" text-anchor="end">4, coverage</text><circle cx="324.1" cy="265.0" r="4.5" class="m2"><title>4, coverage, every node aggregates, 100 nodes: at least 72 privacy tx/s</title></circle><path d="M331.1,260.5 L338.1,265.0 L331.1,269.5 Z" class="m2"/