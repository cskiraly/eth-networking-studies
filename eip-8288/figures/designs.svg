 held (log scale)</text><circle cx="429.1" cy="145.0" r="4.5" class="m2"><title>1, push, a quarter aggregate, 100 nodes: 6 privacy tx/s</title></circle><circle cx="429.1" cy="159.0" r="4.5" class="m1"><title>1, push, a quarter aggregate, 1,000 nodes: 6 privacy tx/s</title></circle><line x1="497.6" x2="522.9" y1="185.0" y2="185.0" class="s2 range"><title>2, pull, a quarter aggregate, 100 nodes: 18–27 privacy tx/s</title></line><circle cx="497.6" cy="185.0" r="4.5" class="m2"><title>2, pull, a quarter aggregate, 100 nodes: 18–27 privacy tx/s</title></circle><circle cx="522.9" cy="185.0" r="4.5" class="m2"><title>2, pull, a quarter aggregate, 100 nodes: 18–27 privacy tx/s</title></circle><circle cx="497.6" cy="199.0" r="4.5" class="m1"><title>2, pull, a quarter aggregate, 1,000 nodes: 18 privacy tx/s</title></circle><line x1="522.9" x2="540.9" y1="225.0" y2="225.0" class="s2 range"><title>3, keep, a quarter aggregate, 100 nodes: 27–36 privacy tx/s</title></line><circle cx="522.9" cy="225.0" r="4.5" class="m2"><title>3, keep, a quarter aggregate, 100 nodes: 27–36 privacy tx/s</title></circle><circle cx="540.9" cy="225.0" r="4.5" class="m2"><title>3, keep, a quarter aggregate, 100 nodes: 27–36 privacy tx/s</title></circle><line x1="540.9" x2="566.1" y1="239.0" y2="239.0" class="s1 range"><title>3, keep, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></line><circle cx="540.9" cy="239.0" r="4.5" class="m1"><title>3, keep, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></circle><circle cx="566.1" cy="239.0" r="4.5" class="m1"><title>3, keep, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></circle><circle cx="540.9" cy="265.0" r="4.5" class="m2"><title>4, coverage, a quarter aggregate, 100 nodes: 36 privacy tx/s</title></circle><line x1="540.9" x2="566.1" y1="279.0" y2="279.0" class="s1 range"><title>4, coverage, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></line><circle cx="540.9" cy="279.0" r="4.5" class="m1"><title>4, coverage, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></circle><circle cx="566.1" cy="279.0" r="4.5" class="m1"><title>4, coverage, a quarter aggregate, 1,000 nodes: 36–54 privacy tx/s</title></circle><circle cx="540.9" cy="305.0" r="4.5" class="m2"><title>5, geth today, a quarter aggregate, 100 nodes: 36 privacy tx/s</title></circle><circle cx="584.1" cy="319.0" r="4.5" class="m1"><title>5, geth today, a quarter aggregate, 1,000 nodes: at least 72 privacy tx/s</title></circle><path d="M591.1,314.5 L598.1,319.0 L591.1,323.5 Z" class="m1"/><text x="632.0" y="120.0" class="head" text-anchor="start">One builder proves everything</text><line x1="645.9" x2="645.9" y1="132" y2="332" class="grid"/><text x="645.9" y="348.0" class="ax" text-anchor="middle">3</text><line x1="689.1" x2="689.1" y1="132" y2="332" class="grid"/><text x="689.1" y="348.0" class="ax" text-anchor="middle">6</text><line x1="714.4" x2="714.4" y1="132" y2="332" class="grid"/><text x="714.4" y="348.0" class="ax" text-anchor="middle">9</text><line x1="732.4" x2="732.4" y1="132" y2="332" class="grid"/><text x="732.4" y="348.0" class="ax" text-anchor="middle">12</text><line x1="757.6" x2="757.6" y1="132" y2="332" class="grid"/><text x="757.6" y="348.0" class="ax" text-anchor="middle">18</text><line x1="782.9" x2="782.9" y1="132" y2="332" class="grid"/><text x="782.9" y="348.0" class="ax" text-anchor="middle">27</text><line x1="800.9" x2="800.9" y1="132" y2="332" class="grid"/><text x="800.9" y="348.0" class="ax" text-anchor="middle">36</text><line x1="826.1" x2="826.1" y1="132" y2="332" class="grid"/><text x="826.1" y="348.0" class="ax" text-anchor="middle">54</text><line x1="844.1" x2="844.1" y1="132" y2="332" class="grid"/><text x="844.1" y="348.0" class="ax" text-anchor="middle">72</text><text x="745.0" y="366.0" class="ax" text-anchor="middle">privacy tx/s held (log scale)</text><line x1="645.9" x2="689.1" y1="145.0" y2="145.0" class="s2 range"><title>1, push, one builder proves everything, 100 nodes: 3–6 privacy tx/s</title></line><circle cx="645.9" cy="145.0" r="4.5" class="m2"><title>1, push, one builder proves everything, 100 nodes: 3–6 privacy tx/s</title></circle><circle cx="689.1" cy="145.0" r="4.5" class="m2"><title>1, push, one builder proves everything, 100 nodes: 3–6 privacy tx/s</title></circle><line x1="645.9" x2="689.1" y1="159.0" y2="159.0" class="s1 range"><title>1, push, one builder proves everything, 1,000 nodes: 3–6 privacy tx/s</title></line><circle cx="645.9" cy="159.0" r="4.5" class="m1"><title>1, push, one builder proves everything, 1,000 nodes: 3–6 privacy tx/s</title></circle><circle cx="689.1" cy="159.0" r="4.5" class="m1"><title>1, push, one builder proves everything, 1,000 nodes: 3–6 privacy tx/s</title></circle><circle cx="714.4" cy="185.0" r="4.5" class="m2"><title>2, pull, one builder proves everything, 100 nodes: 9 privacy tx/s</title></circle><circle cx="714.4" cy="199.0" r="4.5" class="m1"><title>2, pull, one builder proves everything, 1,000 nodes: 9 privacy tx/s</title></circle><circle cx="714.4" cy="225.0" r="4.5" class="m2"><title>3, keep, one builder proves everything, 100 nodes: 9 privacy tx/s</title></circle><circle cx="714.4" cy="239.0" r="4.5" class="m1"><title>3, keep, one builder proves everything, 1,000 nodes: 9 privacy tx/s</title></circle><line x1="689.1" x2="714.4" y1="265.0" y2="265.0" class="s2 range"><title>4, coverage, one builder proves everything, 100 nodes: 6–9 privacy tx/s</title></line><circle cx="689.1" cy="265.0" r="4.5" class="m2"><title>4, coverage, one builder proves everything, 100 nodes: 6–9 privacy tx/s</title></circle><circle cx="714.4" cy="265.0" r="4.5" class="m2"><title>4, coverage, one builder proves everything, 100 nodes: 6–9 privacy tx/s</title></circle><circle cx="689.1" cy="279.0" r="4.5" class="m1"><title>4, coverage, one builder proves everything, 1,000 nodes: 6 privacy tx/s</title></circle><circle cx="714.4" cy="305.0" r="4.5" class="m2"><title>5, geth today, one builder 