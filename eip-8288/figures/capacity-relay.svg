<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 490" width="656" height="490" role="img" aria-labelledby="t d"><title id="t">Aggregating nodes carry more as the network grows; one builder doesn't</title><desc id="d">Capacity against node count, 100 to 3,000 nodes, under the EIP tick with 15 tx/s of signatures, priced by leanVM 990b935's cycle counts. With every raw transaction pushed to every node it rises from 9, 12, 15, 18 privacy tx/s; with raw transactions kept at their entry node, from 18, 27, 45, 54 (2–3 times as much). One builder that proves everything holds 3 at every size.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="656" height="490" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">Aggregating nodes carry more as the network grows; one builder doesn't</text><text x="20.0" y="48.0" class="sub" text-anchor="start">Capacity: the highest privacy rate included at ≥ 95% on every seed, with every lower rate held,</text><text x="20.0" y="64.0" class="sub" text-anchor="start">on top of 15 tx/s of signatures, under the EIP's 1,000 ms tick. The bar reaches the next rate</text><text x="20.0" y="80.0" class="sub" text-anchor="start">tried, which wasn't held. Priced by leanVM 990b935's cycle counts; 4 seeds per cell.</text><line x1="20" x2="42" y1="102" y2="102" class="s1"/><circle cx="31" cy="102" r="4.5" class="m1"/><text x="50.0" y="106.0" class="lab" text-anchor="start">Flood: every raw transaction pushed to every node</text><line x1="20" x2="42" y1="120" y2="120" class="s2"/><circle cx="31" cy="120" r="4.5" class="m2"/><text x="50.0" y="124.0" class="lab" text-anchor="start">No flood: raw transactions stay at their entry node</text><line x1="20" x2="42" y1="138" y2="138" class="s3"/><circle cx="31" cy="138" r="4.5" class="m3"/><text x="50.0" y="142.0" class="lab" text-anchor="start">One builder aggregates (flood)</text><text x="76.0" y="164.0" class="head" text-anchor="start"></text><line x1="76" x2="596" y1="438.0" y2="438.0" class="axis"/><text x="70.0" y="442.0" class="ax" text-anchor="end">0</text><line x1="76" x2="596" y1="373.0" y2="373.0" class="grid"/><text x="70.0" y="377.0" class="ax" text-anchor="end">20</text><line x1="76" x2="596" y1="308.0" y2="308.0" class="grid"/><text x="70.0" y="312.0" class="ax" text-anchor="end">40</text><line x1="76" x2="596" y1="243.0" y2="243.0" class="grid"/><text x="70.0" y="247.0" class="ax" text-anchor="end">60</text><line x1="76" x2="596" y1="178.0" y2="178.0" class="grid"/><text x="70.0" y="182.0" class="ax" text-anchor="end">80</text><text x="42.0" y="308.0" class="ax" text-anchor="middle" transform="rotate(-90 42.0 308.0)">privacy tx/s held</text><text x="76.0" y="454.0" class="ax" text-anchor="middle">100</text><text x="244.0" y="454.0" class="ax" text-anchor="middle">300</text><text x="428.0" y="454.0" class="ax" text-anchor="middle">1,000</text><text x="596.0" y="454.0" class="ax" text-anchor="middle">3,000</text><text x="336.0" y="472.0" class="ax" text-anchor="middle">nodes (log scale)</text><path d="M76.0,408.8 L244.0,399.0 L428.0,389.2 L596.0,379.5" class="s1"/><circle cx="76.0" cy="408.8" r="4.5" class="m1"><title> 100: 9</title></circle><circle cx="244.0" cy="399.0" r="4.5" class="m1"><title> 300: 12</title></circle><circle cx="428.0" cy="389.2" r="4.5" class="m1"><title> 1,000: 15</title></circle><circle cx="596.0" cy="379.5" r="4.5" class="m1"><title> 3,000: 18</title></circle><path d="M76.0,379.5 L244.0,350.2 L428.0,291.8 L596.0,262.5" class="s2"/><circle cx="76.0" cy="379.5" r="4.5" class="m2"><title> 100: 18</title></circle><circle cx="244.0" cy="350.2" r="4.5" class="m2"><title> 300: 27</title></circle><circle cx="428.0" cy="291.8" r="4.5" class="m2"><title> 1,000: 45</title></circle><circle cx="596.0" cy="262.5" r="4.5" class="m2"><title> 3,000: 54</title></circle><path d="M76.0,428.2 L244.0,428.2 L428.0,428.2 L596.0,428.2" class="s3"/><circle cx="76.0" cy="428.2" r="4.5" class="m3"><title> 100: 3</title></circle><circle cx="244.0" cy="428.2" r="4.5" class="m3"><title> 300: 3</title></circle><circle cx="428.0" cy="428.2" r="4.5" class="m3"><title> 1,000: 3</title></circle><circle cx="596.0" cy="428.2" r="4.5" class="m3"><title> 3,000: 3</title></circle><line x1="76.0" x2="76.0" y1="408.8" y2="399.0" class="s1 range"><title>Flood: every raw transaction pushed to every node, 100 nodes: 9 held, 12 not</title></line><line x1="244.0" x2="244.0" y1="399.0" y2="389.2" class="s1 range"><title>Flood: every raw transaction pushed to every node, 300 nodes: 12 held, 15 not</title></line><line x1="428.0" x2="428.0" y1="389.2" y2="379.5" class="s1 range"><title>Flood: every raw transaction pushed to every node, 1,000 nodes: 15 held, 18 not</title></line><line x1="596.0" x2="596.0" y1="379.5" y2="369.8" class="s1 range"><title>Flood: every raw transaction pushed to every node, 3,000 nodes: 18 held, 21 not</title></line><text x="606.0" y="383.5" class="val" text-anchor="start">18</text><line x1="76.0" x2="76.0" y1="379.5" y2="350.2" class="s2 range"><title>No flood: raw transactions stay at their entry node, 100 nodes: 18 held, 27 not</title></line><line x1="244.0" x2="244.0" y1="350.2" y2="321.0" class="s2 range"><title>No flood: raw transactions stay at their entry node, 300 nodes: 27 held, 36 not</title></line><line x1="428.0" x2="428.0" y1="291.8" y2="262.5" class="s2 range"><title>No flood: raw transactions stay at their entry node, 1,000 nodes: 45 held, 54 not</title></line><line x1="596.0" x2="596.0" y1="262.5" y2="204.0" class="s2 range"><title>No flood: raw transactions stay at their entry node, 3,000 nodes: 54 held, 72 not</title></line><text x="606.0" y="266.5" class="val" text-anchor="start">54</text><line x1="76.0" x2="76.0" y1="428.2" y2="418.5" class="s3 range"><title>One builder aggregates (flood), 100 nodes: 3 held, 6 not</title></line><line x1="244.0" x2="244.0" y1="428.2" y2="418.5" class="s3 range"><title>One builder aggregates (flood), 300 nodes: 3 held, 6 not</title></line><line x1="428.0" x2="428.0" y1="428.2" y2="418.5" class="s3 range"><title>One builder aggregates (flood), 1,000 nodes: 3 held, 6 not</title></line><line x1="596.0" x2="596.0" y1="428.2" y2="418.5" class="s3 range"><title>One builder aggregates (flood), 3,000 nodes: 3 held, 6 not</title></line><text x="606.0" y="432.2" class="val" text-anchor="start">3</text></svg>
