egate: 97.1</title></circle><circle cx="507.5" cy="129.5" r="4" class="mo1"><title>15 tx/s, a fifth private, forward best, 25% aggregate: 97.1</title></circle><circle cx="560.0" cy="129.7" r="4" class="mo1"><title>15 tx/s, a fifth private, forward best, 10% aggregate: 97.0</title></circle><path d="M402.5,128.6 L455.0,128.8 L507.5,129.0 L560.0,129.4" class="s2 dash"/><circle cx="402.5" cy="128.6" r="4" class="mo2"><title>15 tx/s, a fifth private, forward all, 75% aggregate: 97.6</title></circle><circle cx="455.0" cy="128.8" r="4" class="mo2"><title>15 tx/s, a fifth private, forward all, 50% aggregate: 97.5</title></circle><circle cx="507.5" cy="129.0" r="4" class="mo2"><title>15 tx/s, a fifth private, forward all, 25% aggregate: 97.4</title></circle><circle cx="560.0" cy="129.4" r="4" class="mo2"><title>15 tx/s, a fifth private, forward all, 10% aggregate: 97.2</title></circle><text x="640.0" y="110.0" class="head" text-anchor="start">Mean inclusion delay (s)</text><line x1="640" x2="850" y1="314.0" y2="314.0" class="axis"/><text x="634.0" y="318.0" class="ax" text-anchor="end">0</text><line x1="640" x2="850" y1="259.7" y2="259.7" class="grid"/><text x="634.0" y="263.7" class="ax" text-anchor="end">4</text><line x1="640" x2="850" y1="205.4" y2="205.4" class="grid"/><text x="634.0" y="209.4" class="ax" text-anchor="end">8</text><line x1="640" x2="850" y1="151.1" y2="151.1" class="grid"/><text x="634.0" y="155.1" class="ax" text-anchor="end">12</text><text x="606.0" y="219.0" class="ax" text-anchor="middle" transform="rotate(-90 606.0 219.0)">mean inclusion delay (s)</text><text x="640.0" y="330.0" class="ax" text-anchor="middle">100%</text><text x="692.5" y="330.0" class="ax" text-anchor="middle">75%</text><text x="745.0" y="330.0" class="ax" text-anchor="middle">50%</text><text x="797.5" y="330.0" class="ax" text-anchor="middle">25%</text><text x="850.0" y="330.0" class="ax" text-anchor="middle">10%</text><text x="745.0" y="348.0" class="ax" text-anchor="middle">node