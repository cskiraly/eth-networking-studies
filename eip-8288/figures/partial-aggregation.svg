<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" role="img" aria-labelledby="t d"><title id="t">What happens when fewer nodes aggregate</title><desc id="d">Three panels against the share of nodes that aggregate, 100% down to 10%. Aggregator CPU falls as aggregators get fewer: from 47% to 25% at 30 tx/s of signatures, and from 72% to 54-56% at 15 tx/s with a fifth private. Relays forwarding every proof run their uplinks 94-98% busy, those forwarding the best one about 60% at 30 tx/s. Mean delay at 30 tx/s falls to 7.4 s when relays forward the best proof and rises to 10.2 s when they forward every proof; at 15 tx/s with privacy it stays near 11.5-12 s.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="880" height="366" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">What happens when fewer nodes aggregate</text><text x="20.0" y="48.0" class="sub" text-anchor="start">1,000 nodes, the EIP's 1,000 ms tick, 4 seeds, raw transactions flooded, priced by cycle counts. Every cell included at least 96.9% on every seed.</text><line x1="20" x2="46" y1="74" y2="74" class="s1"/><text x="52.0" y="78.0" class="lab" text-anchor="start">forward the best proof</text><line x1="222" x2="248" y1="74" y2="74" class="s2"/><text x="254.0" y="78.0" class="lab" text-anchor="start">forward every proof</text><line x1="403" x2="429" y1="74" y2="74" class="axis" style="stroke:var(--ink2);stroke-width:2"/><text x="435.0" y="78.0" class="lab" text-anchor="start">solid: 30 tx/s, signatures only</text><line x1="668" x2="694" y1="74" y2="74" class="axis dash" style="stroke:var(--ink2);stroke-width:2"/><text x="700.0" y="78.0" class="lab" text-anchor="start">dashed: 15 tx/s, a fifth private</text><text x="60.0" y="110.0" class="head" text-anchor="start">Aggregator CPU (%)</text><line x1="60" x2="270" y1="314.0" y2="314.0" class="axis"/><text x="54.0" y="318.0" class="ax" text-anchor="end">0</text><line x1="60" x2="270" y1="266.5" y2="266.5" class="grid"/><text x="54.0" y="270.5" class="ax" text-anchor="end">25</text><line x1="60" x2="270" y1="219.0" y2="219.0" class="grid"/><text x="54.0" y="223.0" class="ax" text-anchor="end">50</text><line x1="60" x2="270" y1="171.5" y2="171.5" class="grid"/><text x="54.0" y="175.5" class="ax" text-anchor="end">75</text><line x1="60" x2="270" y1="124.0" y2="124.0" class="grid"/><text x="54.0" y="128.0" class="ax" text-anchor="end">100</text><text x="26.0" y="219.0" class="ax" text-anchor="middle" transform="rotate(-90 26.0 219.0)">aggregator CPU (%)</text><text x="60.0" y="330.0" class="ax" text-anchor="middle">100%</text><text x="112.5" y="330.0" class="ax" text-anchor="middle">75%</text><text x="165.0" y="330.0" class="ax" text-anchor="middle">50%</text><text x="217.5" y="330.0" class="ax" text-anchor="middle">25%</text><text x="270.0" y="330.0" class="ax" text-anchor="middle">10%</text><text x="165.0" y="348.0" class="ax" text-anchor="middle">nodes that aggregate</text><path d="M60.0,223.9 L112.5,234.0 L165.0,244.0 L217.5,256.5 L270.0,266.7" class="s1"/><circle cx="60.0" cy="223.9" r="4" class="m1"><title>30 tx/s, signatures only, forward (no relays), 100% aggregate: 47.4</title></circle><circle cx="112.5" cy="234.0" r="4" class="m1"><title>30 tx/s, signatures only, forward best, 75% aggregate: 42.1</title></circle><circle cx="165.0" cy="244.0" r="4" class="m1"><title>30 tx/s, signatures only, forward best, 50% aggregate: 36.9</title></circle><circle cx="217.5" cy="256.5" r="4" class="m1"><title>30 tx/s, signatures only, forward best, 25% aggregate: 30.2</title></circle><circle cx="270.0" cy="266.7" r="4" class="m1"><title>30 tx/s, signatures only, forward best, 10% aggregate: 24.9</title></circle><path d="M60.0,223.9 L112.5,229.7 L165.0,240.0 L217.5,255.7 L270.0,266.2" class="s2"/><circle cx="60.0" cy="223.9" r="4" class="m2"><title>30 tx/s, signatures only, forward (no relays), 100% aggregate: 47.4</title></circle><circle cx="112.5" cy="229.7" r="4" class="m2"><title>30 tx/s, signatures only, forward all, 75% aggregate: 44.4</title></circle><circle cx="165.0" cy="240.0" r="4" class="m2"><title>30 tx/s, signatures only, forward all, 50% aggregate: 39.0</title></circle><circle cx="217.5" cy="255.7" r="4" class="m2"><title>30 tx/s, signatures only, forward all, 25% aggregate: 30.7</title></circle><circle cx="270.0" cy="266.2" r="4" class="m2"><title>30 tx/s, signatures only, forward all, 10% aggregate: 25.1</title></circle><path d="M60.0,177.8 L112.5,183.7 L165.0,192.1 L217.5,200.1 L270.0,207.5" class="s1 dash"/><circle cx="60.0" cy="177.8" r="4" class="mo1"><title>15 tx/s, a fifth private, forward (no relays), 100% aggregate: 71.7</title></circle><circle cx="112.5" cy="18