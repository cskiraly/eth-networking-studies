7.1" y="360.0" class="ax" text-anchor="middle">60</text><text x="630.0" y="378.0" class="ax" text-anchor="middle">committed field elements (millions)</text><path d="M480.0,334.4 L771.4,127.1" class="fit"/><text x="488.6" y="146.0" class="lab" text-anchor="start">≈ 79 ms + 24.9 ms per million</text><circle cx="490.4" cy="327.6" r="4.5" class="m2"><title>leaf: 0.135 s, 0.04 M cycles, 2.4 M committed</title></circle><circle cx="710.2" cy="159.8" r="4.5" class="m2"><title>leaf: 1.507 s, 0.94 M cycles, 53.7 M committed</title></circle><circle cx="540.2" cy="293.1" r="4.5" class="m1"><title>fold: 0.416 s, 0.42 M cycles, 14.0 M committed</title></circle><circle cx="552.9" cy="277.1" r="4.5" class="m1"><title>fold: 0.547 s, 0.50 M cycles, 17.0 M committed</title></circle><circle cx="598.1" cy="253.8" r="4.5" class="m1"><title>fold: 0.738 s, 0.83 M cycles, 27.6 M committed</title></circle><circle cx="621.2" cy="237.5" r="4.5" class="m1"><title>fold: 0.871 s, 1.00 M cycles, 33.0 M committed</title></circle><circle cx="713.9" cy="170.7" r="4.5" class="m1"><title>fold: 1.418 s, 1.65 M cycles, 54.6 M committed</title></circle><circle cx="760.3" cy="139.5" r="4.5" class="m1"><title>fold: 1.673 s, 1.99 M cycles, 65.4 M committed</title></circle></svg>
