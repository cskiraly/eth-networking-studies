<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" width="860" height="396" role="img" aria-labelledby="t d"><title id="t">What a proof's time follows</title><desc id="d">Proving time against cycles and against committed size. Against cycles, leaves and folds fall on two lines with prices a factor of two apart. Against committed size, all fall on one line, about 79 ms plus 24.9 ms per million committed elements.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="860" height="396" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">What a proof's time follows</text><text x="20.0" y="48.0" class="sub" text-anchor="start">leanVM 990b935 on a Ryzen 9 8945HS, 16 threads, rate 1/4: leaves of 16 and 512 leanSPHINCS, and 2-, 4- and 8-child folds.</text><line x1="20" x2="42" y1="72" y2="72" class="s1"/><circle cx="31" cy="72" r="4.5" class="m1"/><text x="50.0" y="76.0" class="lab" text-anchor="start">folds</text><line x1="101" x2="123" y1="72" y2="72" class="s2"/><circle cx="112" cy="72" r="4.5" class="m2"/><text x="131.0" y="76.0" class="lab" text-anchor="start">leaves</text><text x="70.0" y="110.0" class="head" text-anchor="start">Against cycles: two prices</text><line x1="70" x2="370" y1="344.0" y2="344.0" class="axis"/><text x="64.0" y="348.0" class="ax" text-anchor="end">0</text><line x1="70" x2="370" y1="282.9" y2="282.9" class="grid"/><text x="64.0" y="286.9" class="ax" text-anchor="end">0.5</text><line x1="70" x2="370" y1="221.8" y2="221.8" class="grid"/><text x="64.0" y="225.8" class="ax" text-anchor="end">1</text><line x1="70" x2="370" y1="160.7" y2="160.7" class="grid"/><text x="64.0" y="164.7" class="ax" text-anchor="end">1.5</text><text x="38.0" y="234.0" class="ax" text-anchor="middle" transform="rotate(-90 38.0 234.0)">proving time (s)</text><text x="70.0" y="360.0" class="ax" text-anchor="middle">0</text><text x="138.2" y="360.0" class="ax" text-anchor="middle">0.5</text><text x="206.4" y="360.0" class="ax" text-anchor="middle">1</text><text x="274.5" y="360.0" class="ax" text-anchor="middle">1.5</text><text x="342.7" y="360.0" class="ax" text-anchor="middle">2</text><text x="220.0" y="378.0" class="ax" text-anchor="middle">VM cycles (millions)</text><path d="M127.4,293.1 L138.8,277.1 L183.4,253.8 L206.2,237.5 L295.4,170.7 L340.9,139.5" class="s1" opacity="0.5"/><path d="M75.3,327.6 L197.7,159.8" class="s2" opacity="0.5"/><text x="191.5" y="149.8" class="lab" text-anchor=