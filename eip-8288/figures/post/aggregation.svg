<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fb0"/></marker>
  <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9661f"/></marker></defs>
  <!-- mesh edges -->
  <g stroke="#ccc" stroke-width="2">
    <line x1="210" y1="90" x2="400" y2="70"/><line x1="210" y1="90" x2="400" y2="200"/>
    <line x1="210" y1="300" x2="400" y2="200"/><line x1="210" y1="300" x2="400" y2="330"/>
    <line x1="400" y1="70" x2="400" y2="200"/><line x1="400" y1="70" x2="600" y2="130"/>
    <line x1="400" y1="200" x2="600" y2="130"/><line x1="400" y1="200" x2="600" y2="280"/>
    <line x1="400" y1="330" x2="600" y2="280"/><line x1="600" y1="130" x2="600" y2="280"/>
    <line x1="600" y1="130" x2="790" y2="205"/><line x1="600" y1="280" x2="790" y2="205"/>
  </g>
  <!-- proofs travelling -->
  <line x1="236" y1="104" x2="372" y2="186" stroke="#2a6fb0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="236" y1="288" x2="372" y2="214" stroke="#2a6fb0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="427" y1="193" x2="572" y2="140" stroke="#2a6fb0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="627" y1="140" x2="764" y2="196" stroke="#2a6fb0" stroke-width="3" marker-end="url(#a)"/>
  <!-- raw entering -->
  <line x1="60" y1="90" x2="180" y2="90" stroke="#d9661f" stroke-width="3" marker-end="url(#k)"/>
  <line x1="60" y1="300" x2="180" y2="300" stroke="#d9661f" stroke-width="3" marker-end="url(#k)"/>
  <line x1="400" y1="392" x2="400" y2="360" stroke="#d9661f" stroke-width="3" marker-end="url(#k)"/>
  <rect x="14" y="52" width="112" height="28" rx="6" fill="#fdf0e6" stroke="#d9661f"/><text x="70" y="71" font-size="14" text-anchor="middle">tx 1 + witness</text>
  <rect x="14" y="262" width="112" height="28" rx="6" fill="#fdf0e6" stroke="#d9661f"/><text x="70" y="281" font-size="14" text-anchor="middle">tx 2 + witness</text>
  <rect x="418" y="362" width="112" height="28" rx="6" fill="#fdf0e6" stroke="#d9661f"/><text x="474" y="381" font-size="14" text-anchor="middle">tx 3 + witness</text>
  <!-- nodes -->
  <g fill="#fff" stroke="#333" stroke-width="2">
    <circle cx="210" cy="90" r="26"/><circle cx="210" cy="300" r="26"/>
    <circle cx="400" cy="70" r="26"/><circle cx="400" cy="200" r="26"/><circle cx="400" cy="330" r="26"/>
    <circle cx="600" cy="130" r="26"/><circle cx="600" cy="280" r="26"/>
  </g>
  <rect x="766" y="170" width="170" height="70" rx="10" fill="#f2f6fb" stroke="#2a6fb0" stroke-width="2"/>
  <text x="851" y="200" font-size="16" text-anchor="middle">Builder</text>
  <text x="851" y="222" font-size="14" text-anchor="middle" fill="#555">one proof for the block</text>
  <!-- proof labels -->
  <rect x="236" y="148" width="104" height="24" rx="12" fill="#2a6fb0"/><text x="288" y="165" font-size="13.5" text-anchor="middle" fill="#fff">proof {1}</text>
  <rect x="236" y="226" width="104" height="24" rx="12" fill="#2a6fb0"/><text x="288" y="243" font-size="13.5" text-anchor="middle" fill="#fff">proof {2}</text>
  <rect x="440" y="140" width="112" height="24" rx="12" fill="#2a6fb0"/><text x="496" y="157" font-size="13.5" text-anchor="middle" fill="#fff">proof {1, 2}</text>
  <rect x="640" y="122" width="124" height="24" rx="12" fill="#2a6fb0"/><text x="702" y="139" font-size="13.5" text-anchor="middle" fill="#fff">proof {1, 2, 3}</text>
  <text x="660" y="356" font-size="14" fill="#555">every tick, each node folds what it</text>
  <text x="660" y="376" font-size="14" fill="#555">knows into one proof, sends it on</text>
</svg>
