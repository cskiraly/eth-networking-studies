" class="m1"><title> 40: 28.25</title></circle><circle cx="684.1" cy="171.9" r="4.5" class="m1"><title> 100: 21.2</title></circle><circle cx="748.9" cy="198.5" r="4.5" class="m1"><title> 300: 16.5</title></circle><circle cx="820.0" cy="211.4" r="4.5" class="m1"><title> 1,000: 14.22</title></circle><path d="M630.0,195.7 L684.1,223.4 L748.9,246.1 L820.0,260.7" class="s2"/><circle cx="630.0" cy="195.7" r="4.5" class="m2"><title> 40: 17</title></circle><circle cx="684.1" cy="223.4" r="4.5" class="m2"><title> 100: 12.1</title></circle><circle cx="748.9" cy="246.1" r="4.5" class="m2"><title> 300: 8.1</title></circle><circle cx="820.0" cy="260.7" r="4.5" class="m2"><title> 1,000: 5.53</title></circle></svg>
