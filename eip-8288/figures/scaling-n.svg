.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="880" height="344" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">What grows with the number of nodes</text><text x="20.0" y="48.0" class="sub" text-anchor="start">15 tx/s, a fifth private, raw transactions flooded, 2 seeds per point; every run included all. leanVM-b's weights, a nested proof at 151.5 ms.</text><line x1="20" x2="42" y1="72" y2="72" class="s1"/><circle cx="31" cy="72" r="4.5" class="m1"/><text x="50.0" y="76.0" class="lab" text-anchor="start">EIP-8288: 1,000 ms tick</text><line x1="227" x2="249" y1="72" y2="72" class="s2"/><circle cx="238" cy="72" r="4.5" class="m2"/><text x="257.0" y="76.0" class="lab" text-anchor="start">Tickless (≤ 2 s)</text><text x="60.0" y="108.0" class="head" text-anchor="start">Mean inclusion delay (s)</text><line x1="60" x2="270" y1="292.0" y2="292.0" class="axis"/><text x="54.0" y="296.0" class="ax" text-anchor="end">0</text><line x1="60" x2="270" y1="243.4" y2="243.4" class="grid"/><text x="54.0" y="247.4" class="ax" text-anchor="end">4</text><line x1="60" x2="270" y1="194.9" y2="194.9" class="grid"/><text x="54.0" y="198.9" class="ax" text-anchor="end">8</text><line x1="60" x2="270" y1="146.3" y2="146.3" class="grid"/><text x="54.0" y="150.3" class="ax" text-anchor="end">12</text><text x="26.0" y="207.0" class="ax" text-anchor="middle" transform="rotate(-90 26.0 207.0)">mean delay (s)</text><text x="60.0" y="308.0" class="ax" text-anchor="middle">40</text><text x="119.8" y="308.0" class="ax" text-anchor="middle">100</text><text x="191.5" y="308.0" class="ax" text-anchor="middle">300</text><text x="270.0" y="308.0" class="ax" text-anchor="middle">1,000</text><text x="165.0" y="326.0" class="ax" text-anchor="middle">nodes (log scale)</text><path d="M60.0,175.4 L119.8,165.2 L191.5,153.6 L270.0,140.5" class="s1"/><circle cx="60.0" cy="175.4" r="4.5" class="m1"><title> 40: 9.6</title></circle><circle cx="119.8" cy="165.2" r="4.5" class="m1"><title> 100: 10.44</title></circle><circle cx="191.5" cy="153.6" r="4.5" class="m1"><title> 300: 11.4</title></circle><circle cx="270.0" cy="140.5" r="4.5" class="m1"><title> 1,000: 12.48</title></circle><path d="M60.0,178.3 L119.8,166.7 L191.5,153.6 L270.0,140.5" class="s2"/><circle cx="60.0" cy="178.3" r="4.5" class="m2"><title> 40: 9.36</title></circle><circle cx="119.8" cy="166.7" r="4.5" class="m2"><title> 100: 10.32</title></circle><circle cx="191.5" cy="153.6" r="4.5" class="m2"><title> 300: 11.4</title></circle><circle cx="270.0" cy="140.5" r="4.5" class="m2"><title> 1,000: 12.48</title></circle><text x="165.0" y="236.0" class="lab" text-anchor="middle">the two designs overlap:</text><text x="165.0" y="252.0" class="lab" text-anchor="middle">+3 s for 25× the nodes</text><text x="345.0" y="108.0" class="head" text-anchor="start">CPU busy, per node (%)</text><line x1="345" x2="555" y1="292.0" y2="292.0" class="axis"/><text x="339.0" y="296.0" class="ax" text-anchor="end">0</text><line x1="345" x2="555" y1="249.5" y2="249.5" class="grid"/><text x="339.0" y="253.5" class="ax" text-anchor="end">25</text><line x1="345" x2="555" y1="207.0" y2="207.0" class="grid"/><text x="339.0" y="211.0" class="ax" text-anchor="end">50</text><line x1="345" x2="555" y1="164.5" y2="164.5" class="grid"/><text x="339.0" y="168.5" class="ax" text-anchor="end">75</text><line x1="345" x2="555" y1="122.0" y2="122.0" class="grid"/><text x="339.0" y="126.0" class="ax" text-anchor="end">100</text><text x="311.0" y="207.0" class="ax" text-anchor="middle" transform="rotate(-90 311.0 207.0)">CPU busy (%)</text><text x="345.0" y="308.0" class="ax" text-anchor="middle">40</text><text x="404.8" y="308.0" class="ax" text-anchor="middle">100</text><text x="476.5" y="308.0" class="ax" text-anchor="middle">300</text><text x="555.0" y="308.0" class="ax" text-anchor="middle">1,000</text><text x="450.0" y="326.0" class="ax" text-anchor="middle">nodes (log scale)</text><path d="M345.0,191.7 L404.8,193.4 L476.5,193.4 L555.0,191.7" class="s1"