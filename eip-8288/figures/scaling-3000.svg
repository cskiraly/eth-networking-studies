<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" role="img" aria-labelledby="t d"><title id="t">Delay grows slowly with the network</title><desc id="d">Mean inclusion delay against node count from 100 to 3,000 at three load points. Under the EIP tick it rises from 7.6 to 8.8 s with signatures only, from 10.1 to 12.9 s at 15 tx/s with a fifth private, and from 11.7 to 14.4 s at 30 tx/s with a fifth private; tickless rises from 9.5 to 12.8 s with signatures only. Every point included every transaction, and per-node CPU stayed flat.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="880" height="366" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">Delay grows slowly with the network</text><text x="20.0" y="48.0" class="sub" text-anchor="start">100 to 3,000 nodes, raw transactions flooded, priced by cycle counts, 8 seeds a point. Every point included everything; per-node CPU stayed flat.</text><line x1="20" x2="42" y1="72" y2="72" class="s1"/><circle cx="31" cy="72" r="4.5" class="m1"/><text x="50.0" y="76.0" class="lab" text-anchor="start">EIP-8288: 1,000 ms tick</text><line x1="227" x2="249" y1="72" y2="72" class="s2"/><circle cx="238" cy="72" r="4.5" class="m2"/><text x="257.0" y="76.0" class="lab" text-anchor="start">Tickless (≤ 2 s)</text><text x="60.0" y="110.0" class="head" text-anchor="start">30 tx/s, signatures only</text><line x1="60" x2="280" y1="314.0" y2="314.0" class="axis"/><text x="54.0" y="318.0" class="ax" text-anchor="end">0</text><line x1="60" x2="280" y1="250.7" y2="250.7" class="grid"/><text x="54.0" y="254.7" class="ax" text-anchor="end">6</text><line x1="60" x2="280" y1="187.3" y2="187.3" class="grid"/><text x="54.0" y="191.3" class="ax" text-anchor="end">12</text><line x1="60" x2="280" y1="124.0" y2="124.0" class="grid"/><text x="54.0" y="128.0" class="ax" text-anchor="end">18</text><text x="30.0" y="219.0" class="ax" text-anchor="middle" transform="rotate(-90 30.0 219.0)">mean inclusion delay (s)</text><line x1="60" x2="280" y1="250.7" y2="250.7" class="ref"/><text x="280.0" y="264.7" class="ax" text-anchor="end">ideal: next block, 6 s</text><text x="60.0" y="330.0" class="ax" text-anchor="middle">100</text><text x="131.1" y="330.0" class="ax" text-anchor="middle">300</text><text x="208.9" y="330.0" class="ax" text-anchor="middle">1,000</text><text x="280.0" y="330.0" class="ax" text-anchor="middle">3,000</text><text x="170.0" y="348.0" class="ax" text-anchor="middle">nodes (log scale)</text><path d="M60.0,234.7 L131.1,228.6 L208.9,224.0 L280.0,220.7" class="s1"/><circle