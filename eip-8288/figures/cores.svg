<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" role="img" aria-labelledby="t d"><title id="t">What a node's cores buy</title><desc id="d">Proving time of leanVM's README 2-to-1 on a Ryzen 9 8945HS: 566 ms on 16 threads and 588 on 8 (1.9 times the M4 Max's 303 ms), 816 on 4 (2.7 times) and 1,418 on 2 (4.7 times), beyond version 10's 4 times slower reference prover.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="760" height="394" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">What a node's cores buy</text><text x="20.0" y="48.0" class="sub" text-anchor="start">leanVM's README 2→1 (900 leanXMSS per leaf, rate 1/4) on a Ryzen 9 8945HS (8 cores), by threads given to proving.</text><text x="20.0" y="66.0" class="sub" text-anchor="start">Dashed: version 10's three reference provers. The fast one is the M4 Max's 303 ms from the same README.</text><line x1="70" x2="540" y1="344.0" y2="344.0" class="axis"/><text x="64.0" y="348.0" class="ax" text-anchor="end">0</text><line x1="70" x2="540" y1="264.0" y2="264.0" class="grid"/><text x="64.0" y="268.0" class="ax" text-anchor="end">500</text><line x1="70" x2="540" y1="184.0" y2="184.0" class="grid"/><text x="64.0" y="188.0" class="ax" text-anchor="end">1,000</text><line x1="70" x2="540" y1="104.0" y2="104.0" class="grid"/><text x="64.0" y="108.0" class="ax" text-anchor="end">1,500</text><text x="26.0" y="224.0" class="ax" text-anchor="middle" transform="rotate(-90 26.0 224.0)">2→1 proving time (ms)</text><line x1="70" x2="540" y1="295.5" y2="295.5" class="ref"/><text x="548.0" y="299.5" class="ax" text-anchor="start">fast: M4 Max, 303 ms</text><line x1="70" x2="540" y1="247.0" y2="247.0" class="ref"/><text x="548.0" y="251.0" class="ax" text-anchor="start">2× slower, 606 ms</text><line x1="70" x2="540" y1="150.1" y2="150.1" class="ref"/><text x="548.0" y="154.1" class="ax" text-anchor="start">4× slower, 1,212 ms</text><path d="M99.4,344.0 V257.4 q0,-4 4,-4 H154.1 q4,0 4,4 V344.0 Z" class="bar"><title>16 threads: 566 ms, 1.9× the M4 Max</title></path><text x="128.8" y="245.4" class="val" text-anchor="middle">566 ms</text><text x="128.8" y="360.0" class="ax" text-anchor="middle">16 threads</text><text x="128.8" y="375.0" class="ax" text-anchor="middle">1.9× M4 Max</text><path d="M216.9,344.0 V253.9 q0,-4 4,-4 H271.6 q4,0 4,4 V344.0 Z" class="bar"><title>8 threads: 588 ms, 1.9× the M4 Max</title></path><text x="246.2" y="241.9" class="val" text-anchor="middle">588 ms</text><text x="246.2" y="360.0" class="ax" text-anchor="middle">8 threads</text><text x="246.2" y="375.0" class="ax" text-anchor="middle">1.9× M4 Max</text><path d="M334.4,344.0 V217.4 q0,-4 4,-4 H389.1 q4,0 4,4 V344.0 Z" class="bar"><title>4 threads: 816 ms, 2.7× the M4 Max</title></path><text x="363.8" y="205.4" class="val" text-anchor="middle">816 ms</text><text x="363.8" y="360.0" class="ax" text-anchor="middle">4 threads</text><text x="363.8" y="375.0" class="ax" text-anchor="middle">2.7× M4 Max</text><path d="M451.9,344.0 V121.1 q0,-4 4,-4 H506.6 q4,0 4,4 V344.0 Z" class="bar"><title>2 threads: 1418 ms, 4.7× the M4 Max</title></path><text x="481.2" y="109.1" class="val" text-anchor="middle">1,418 ms</text><text x="481.2" y="360.0" class="ax" text-anchor="middle">2 threads</text><text x="481.2" y="375.0" class="ax" text-anchor="middle">4.7× M4 Max</text></svg>
