<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" width="780" height="452" role="img" aria-labelledby="t d"><title id="t">Prover speed sets privacy capacity</title><desc id="d">Privacy capacity at 30 tx/s against prover speed, at 1,000 and 40 nodes. On the fast prover the EIP tick holds 15 or more privacy tx/s at 1,000 nodes and 7.5 at 40; tickless 15 or more at both. On a 2x slower prover both sizes give the same: 1.5 under the tick and 3 tickless. On a 4x slower one nothing private holds at either size.</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--held:#e3f1e3;--held-ink:#1f5f1f;--marg:#fbf0d6;
--marg-ink:#7a5600;--coll:#f7e1e0;--coll-ink:#8e2626;--today:#0b0b0b}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--held:#1f3321;
--held-ink:#9fd69f;--marg:#3a3018;--marg-ink:#f0cf7a;--coll:#3d2222;--coll-ink:#f0a3a3;
--today:#f0efec}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600}
.lab{font-size:12px;fill:var(--ink2)}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.val{font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.s1{stroke:var(--s1);fill:none;stroke-width:2}
.s2{stroke:var(--s2);fill:none;stroke-width:2}
.s3{stroke:var(--s3);fill:none;stroke-width:2}
.m3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.dash{stroke-dasharray:5 4}
.m1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.m2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.mo1{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.mo2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.bar{fill:var(--s1)}
.held{fill:var(--held)} .marginal{fill:var(--marg)} .collapsed{fill:var(--coll)}
.t-held{fill:var(--held-ink)} .t-marginal{fill:var(--marg-ink)} .t-collapsed{fill:var(--coll-ink)}
.today{fill:none;stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.frontier{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.range{stroke-width:6;stroke-linecap:round;opacity:.3}
</style><rect class="bg" width="780" height="452" rx="8"/><text x="20.0" y="28.0" class="title" text-anchor="start">Prover speed sets privacy capacity (priced by cycle counts)</text><text x="20.0" y="48.0" class="sub" text-anchor="start">Highest privacy rate included on every seed, at 30 tx/s in all; a privacy witness costs one nested proof. Arrows: held at the</text><text x="20.0" y="66.0" class="sub" text-anchor="start">highest rate tried. Raw transactions flooded. 1,000 nodes: 8 seeds on the fast prover, 4 on the slower ones; 40 nodes: 4.</text><line x1="20" x2="46" y1="92" y2="92" class="s1"/><text x="52.0" y="96.0" class="lab" text-anchor="start">EIP tick, 1,000 nodes</text><line x1="211" x2="237" y1="92" y2="92" class="s1 dash"/><text x="243.0" y="96.0" class="lab" text-anchor="start">EIP tick, 40 nodes</text><line x1="381" x2="407" y1="92" y2="92" class="s2"/><text x="413.0" y="96.0" class="lab" text-anchor="start">tickless, 1,000 nodes</text><line x1="572" x2="598" y1="92" y2="92" class="s2 dash"/><text x="604.0" y="96.0" class="lab" text-anchor="start">tickless, 40 nodes</text><line x1="70" x2="540" y1="382.0" y2="382.0" class="axis"/><text x="62.0" y="386.0" class="ax" text-anchor="end">0</text><line x1="70" x2="540" y1="319.5" y2="319.5" class="grid"/><text x="62.0" y="323.5" class="ax" text-anchor="end">4</text><line x1="70" x2="540" y1="257.0" y2="257.0" class="grid"/><text x="62.0" y="261.0" class="ax" text-anchor="end">8</text><line x1="70" x2="540" y1="194.5" y2="194.5" class="grid"/><text x="62.0" y="198.5" class="ax" text-anchor="end">12</text><line x1="70" x2="540" y1="132.0" y2="132.0" class="grid"/><text x="62.0" y="136.0" class="ax" text-anchor="end">16</text><text x="34.0" y="257.0" class="ax" text-anchor="middle" transform="rotate(-90 34.0 257.0)">privacy tx/s carried</text><line x1="70" x2="540" y1="288.2" y2="288.2" class="ref"/><text x="548.0" y="292.2" class="ax" text-anchor="start">a fifth of 30 tx/s</text><line x1="70" x2="540" y1="147.6" y2="147.6" class="ref"/><text x="548.0" y="151.6" class="ax" text-anchor="start">half of 30 tx/s</text><text x="70.0" y="400.0" class="ax" text-anchor="middle">fast: 303 ms</text><text x="70.0" y="415.0" class="ax" text-anchor="middle">an M4 Max</text><text x="305.0" y="400.0" class="ax" text-anchor="middle">2× slower</text><text x="305.0" y="415.0" class="ax" text-anchor="middle">8-core Ryzen, all cores</text><text x="540.0" y="400.0" class="ax" text-anchor="middle">4× slower</text><text x="540.0" y="415.0" class="ax" text-anchor="middle">Ryzen on 2 cores is 4.7×</text><text x="305.0" y="436.0" class="ax" text-anchor="middle">prover speed (a 2→1 fold's time)</text><path d="M70.0,147.6 L305.0,358.6 L540.0,382.0" class="s1"/><circle cx="70.0" cy="147.6" r="4.5" class="m1"><title>EIP tick, 1,000 nodes, fast: 303 ms: 15 privacy tx/s or more</title></circle><path d="M70.0,139.6 l0,-14 m-5,5 l5,-5 l5,5" class="s1"/><circle cx="305.0" cy="358.6" r="4.5" class="m1"><title>EIP tick, 1,000 nodes, 2× slower: 1.5 privacy tx/s</title></circle><circle cx="540.0" cy="382.0" r="4.5" class="m1"><title>EIP tick, 1,000 nodes, 4× slower: 0 privacy tx/s</title></circle><path d="M70.0,264.8 L305.0,358.6 L540.0,382.0" class="s1 dash"/><circle cx="70.0" cy="264.8" r="4.5" class="mo1"><title>EIP tick, 40 nodes, fast: 303 ms: 7.5 privacy tx/s</title></circle><circle cx="305.0" cy="358.6" r="4.5" class="mo1"><title>EIP tick, 40 nodes, 2× slower: 1.5 privacy tx/s</title></circle><circle cx="540.0" cy="382.0" r="4.5" class="mo1"><title>EIP tick, 40 nodes, 4× slower: 0 privacy tx/s</title></circle><path d="M70.0,147.6 L305.0,335.1 L540.0,382.0" class="s2"/><circle cx="70.0" cy="147.6" r="4.5" class="m2"><title>tickless, 1,000 nodes, fast: 303 ms: 15 privacy tx/s or more</title></circle><path d="M70.0,139.6 l0,-14 m-5,5 l5,-5 l5,5" class="s2"/><circle cx="305.0" cy="335.1" r="4.5" class="m2"><title>tickless, 1,000 nodes, 2× slower: 3 privacy tx/s</title></circle><circle cx="540.0" cy="382.0" r="4.5" class="m2"><title>tickless, 1,000 nodes, 4× slower: 0 privacy tx/s</title></circle><path d="M70.0,147.6 L305.0,335.1 L540.0,382.0" class="s2 dash"/><circle cx="70.0" cy="147.6" r="4.5" class="mo2"><title>tickless, 40 nodes, fast: 303 ms: 15 privacy tx/s or more</title></circle><path d="M70.0,139.6 l0,-14 m-5,5 l5,-5 l5,5" class="s2"/><circle cx="305.0" cy="335.1" r="4.5" class="mo2"><title>tickless, 40 nodes, 2× slower: 3 privacy tx/s</title></circle><circle cx="540.0" cy="382.0" r="4.5" class="mo2"><title>tickless, 40 nodes, 4× slower: 0 privacy tx/s</title></circle><text x="80.0" y="268.8" class="lab" text-anchor="start">7.5 at 40 nodes</text><text x="315.0" y="327.1" class="lab" text-anchor="start">3</text><text x="315.0" y="372.6" class="lab" text-anchor="start">1.5</text><text x="530.0" y="344.5" class="lab" text-anchor="end">nothing private holds</text><text x="114.0" y="163.6" class="lab" text-anchor="start">15 or more at 1,000 nodes, both designs</text></svg>
